name: Vehicle physics tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  physics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/vehicle-physics.test.js
      - run: node --check vehicle-physics.js
      - run: node --check truckvision.js
